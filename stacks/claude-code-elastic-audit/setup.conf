# Control plane — backend endpoints scripts/setup.{sh,ps1} target.
# (elasticsearch.url is also reused by the Elasticsearch MCP.)
elasticsearch.url=http://localhost:9200
kibana.url=http://localhost:5601

# Agent data plane — audit hook capture posture and delivery endpoint.
# These are REQUIRED (no fallback to the control-plane elasticsearch.url).
# The api_key is a secret and lives in a gitignored setup.local.conf
# (copy setup.local.conf.example); absent → empty, no error.
agent_audit.elasticsearch.url=http://localhost:9200
agent_audit.elasticsearch.timeout_ms=1000
agent_audit.capture.user_prompt.enabled=true
agent_audit.capture.user_prompt.content=plaintext
agent_audit.capture.tool_call.enabled=true
agent_audit.capture.tool_call.content=plaintext
