# claude-code-elastic — direct path, Elastic backend (composition).
#
# This stack is the 1×1×1 composition of the Elastic backend with Claude Code
# over the direct path (agent → APM Server, no Collector). The backend services
# (Elasticsearch + Kibana + APM Server), their config, the Kibana NDJSON, and the
# bootstrap scripts all live in ../../components/backends/elastic/ and are pulled
# in via `include:` below. Per-stack glue (the smoke test, the routing shims)
# lives alongside this file under scripts/.
#
# `name:` is set explicitly so the Compose project name is claude-code-elastic
# (and not derived from the included backend compose file's own `name:`).

name: claude-code-elastic

include:
  - ../../components/backends/elastic/docker-compose.yml
