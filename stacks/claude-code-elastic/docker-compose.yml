# claude-code-elastic — Elastic Stack base
#
# Single-node, security-disabled local demo. Do NOT expose publicly.
# All services share one pinned Elastic Stack version (see SPEC: "One version, pinned").
#
# Brings up Elasticsearch + Kibana. APM Server (the OTLP receiver) is added in a
# later task; this file is the base both build on.

name: claude-code-elastic

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: cce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # Keep the demo light on memory; this is not a production sizing.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      # Bind to localhost only — demo posture, never exposed publicly.
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # Security is disabled, so the HTTP API is reachable without auth/TLS.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: cce-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_HOST=0.0.0.0
    ports:
      # Bind to localhost only — demo posture, never exposed publicly.
      - "127.0.0.1:5601:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5601/api/status | grep -qE '\"level\":\"available\"'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

volumes:
  elasticsearch-data:
    driver: local
