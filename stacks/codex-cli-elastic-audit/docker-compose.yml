# codex-cli-elastic-audit — direct agent-audit, Elastic backend (composition).
#
# The audit counterpart to codex-cli-elastic. It composes the **elastic-audit**
# backend (Elasticsearch + Kibana, NO APM Server) with OpenAI Codex CLI's audit
# hooks: each submitted prompt and completed tool call is written straight to
# Elasticsearch (logs-agent_audit.user_prompt-default / .tool_call-default) by a
# fail-open hook — a direct path that never traverses the OTLP / APM pipeline
# (see SPEC/agent-audit.md "Where this runs"). Because there is no telemetry
# here, the composed backend visibly carries no APM Server.
#
# This is an ALTERNATIVE to codex-cli-elastic, not a co-run: it reuses the same
# aol-* container names and host ports (9200 / 5601), and owns its own Compose
# project, volumes, and agent home (.codex with only agent-audit.toml + hooks.json,
# no [otel] config.toml). `docker compose down` the telemetry stack — or any other
# Elastic stack — before bringing this one up.
#
# `name:` is set explicitly so the Compose project name is codex-cli-elastic-audit
# (and not derived from an included file's own `name:`).

name: codex-cli-elastic-audit

include:
  - ../../components/backends/elastic-audit/docker-compose.yml
