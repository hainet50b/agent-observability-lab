# Agent data plane — audit hook capture posture and delivery endpoint. Read by
# the agent-config CLI; the api_key secret lives in a gitignored
# agent-config.local.toml (copy agent-config.local.toml.example).
# content: "plaintext" | "redacted" | "encrypted"
[agent_config]
executor = "agent-observability-lab"

[agent_audit.elasticsearch]
url = "http://localhost:9200"
timeout_ms = 2000

[agent_audit.capture.user_prompt]
enabled = true
content = "plaintext"

[agent_audit.capture.tool_call]
enabled = true
content = "plaintext"

# Edge content-sealing (opt-in): content = "encrypted" seals stream bodies to the
# public cert at <recipients-root>/<epoch>/recipient.pem. The root defaults to
# sealing/recipients beside this file; this lab keeps it at the repo root, so pass
# --seal-recipients ../../sealing/recipients (or --seal-cert <pem>) to the CLI.
# [agent_audit.seal]
# epoch = ""
