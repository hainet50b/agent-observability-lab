# Agent data plane for the elastic backend — how an agent reaches it, and the
# audit capture posture. Copy this file into a workbench directory and run
# `agent-config place` against the copy; the api_key secrets live in a
# gitignored agent-config.local.toml beside it (see TOUR.md).
[agent_config]
executor = "agent-observability-lab"

[telemetry.apm_server]
endpoint = "http://localhost:8200"

[agent_audit.elasticsearch]
url = "http://localhost:9200"
timeout_ms = 2000

[agent_audit.capture.user_prompt]
enabled = true
content = "plaintext"

[agent_audit.capture.tool_call]
enabled = true
content = "plaintext"
