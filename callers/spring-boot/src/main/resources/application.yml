spring:
  application:
    name: spring-boot-caller
  main:
    banner-mode: "off"
    log-startup-info: false

# All overridable at launch, e.g.
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments="--caller.name=checkout-svc --caller.prompt=say hi"
caller:
  agent: claude # which agent to launch (implemented: claude)
  name: aol-app
  prompt: "say hi in one word"
  command: "" # blank → the agent's default CLI (e.g. claude), resolved on PATH
  working-dir: "" # blank → the agent's default stack dir (holds its telemetry config)

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C

logging:
  level:
    root: WARN
    lab.agentobservability.callers: INFO
