services:
  apm-server:
    image: docker.elastic.co/apm/apm-server:9.4.2
    container_name: aol-apm-server
    depends_on:
      elasticsearch:
        condition: service_healthy
    # strict.perms=false: apm-server.yml is bind-mounted, not owned by the in-container user
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./config/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      # the image ships no curl/wget; probe the OTLP port via bash /dev/tcp (root returns 200 when ready)
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/localhost/8200; printf "GET / HTTP/1.0\r\n\r\n" >&3; read -t 5 line <&3; case "$$line" in *200*) exit 0;; *) exit 1;; esac',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
