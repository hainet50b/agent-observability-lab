# Kibana service fragment — shared, agent- and backend-agnostic.
#
# Composed into backends via `docker compose include:` alongside the
# elasticsearch fragment (whose `elasticsearch` service it depends on), so it
# carries no top-level `name:`. Demo posture; do NOT expose publicly.

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: aol-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      # Bind to localhost only — demo posture, never exposed publicly.
      - "127.0.0.1:5601:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5601/api/status | grep -qE '\"level\":\"available\"'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
