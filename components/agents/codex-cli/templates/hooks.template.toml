# docs:   https://developers.openai.com/codex/hooks
# schema: https://github.com/openai/codex/blob/main/codex-rs/config/src/hook_config.rs (HookHandlerConfig)
#
# commandWindows spawns the hook via `powershell` (Windows PowerShell 5.1 —
# guaranteed on every employee workstation, unlike pwsh/PS7 which may be absent)
# with -NoProfile (skip the user profile), -NonInteractive, and -ExecutionPolicy
# Bypass (run on locked-down machines). The capture-*.ps1 hooks are 5.1-clean.

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '@@USER_PROMPT_SH@@ --config @@AGENT_AUDIT_CONF@@'
commandWindows = 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File @@USER_PROMPT_PS1@@ -Config @@AGENT_AUDIT_CONF@@'
timeout = 3
statusMessage = "Delivering UserPromptSubmit audit document"

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = '@@TOOL_CALL_SH@@ --config @@AGENT_AUDIT_CONF@@'
commandWindows = 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File @@TOOL_CALL_PS1@@ -Config @@AGENT_AUDIT_CONF@@'
timeout = 3
statusMessage = "Delivering PostToolUse audit document"
