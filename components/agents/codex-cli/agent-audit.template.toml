# Codex CLI Agent Audit — direct Elasticsearch delivery config.
#
# Read by the UserPromptSubmit hook (hooks/capture-user-prompt.{sh,ps1}) to deliver
# each captured prompt as a canonical agent_audit.user_prompt document to the local
# Agent Audit data stream. It lives beside config.toml / hooks.json under
# CODEX_HOME=<stack>/.codex (gitignored). Delivery configuration is kept HERE, in a
# hook-specific file, rather than in Codex's native config.toml (see
# ../../../SPEC/agent-audit.md "Delivery and authorization").
#
# scripts/render-agent-audit.{sh,ps1} fill the url field below with the stack's
# Elasticsearch base URL. These are LOCAL lab defaults: this stack's
# Elasticsearch runs single-node with security disabled, so api_key is empty (no
# auth). For a secured / production cluster, set url to an https:// endpoint and
# api_key to a key scoped to create_doc on logs-agent_audit.user_prompt-* — the
# hook's write credential is create-only; template / data-stream / mapping setup is
# done by stack/admin credentials, not the hook (see SPEC/agent-audit.md).
#
# create-if-absent: an existing agent-audit.toml is left untouched, so a real
# api_key you add survives a setup re-run. Delete it to regenerate from this template.

[elasticsearch]
url = "@@ES_URL@@"
data_stream = "logs-agent_audit.user_prompt-default"
api_key = ""
# Very short HTTP timeout — an unavailable audit destination must not noticeably
# delay agent usage. Delivery is fail-open (see SPEC/agent-audit.md "Delivery").
timeout_ms = 300

[audit]
# "plaintext" populates the searchable agent_audit.prompt.text (lab default). A
# future encrypted mode would null that and populate agent_audit.prompt.encrypted_text.
mode = "plaintext"
