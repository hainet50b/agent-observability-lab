# docs:   https://developers.openai.com/codex/config-reference
# schema: https://github.com/openai/codex/blob/main/codex-rs/config/src/types.rs (OtelConfigToml)

[otel]
environment = "dev"
log_user_prompt = false

[otel.exporter.otlp-http]
endpoint = "@@OTLP_ENDPOINT@@/v1/logs"
protocol = "binary"
headers = {}

[otel.trace_exporter.otlp-http]
endpoint = "@@OTLP_ENDPOINT@@/v1/traces"
protocol = "binary"
headers = {}

[otel.metrics_exporter.otlp-http]
endpoint = "@@OTLP_ENDPOINT@@/v1/metrics"
protocol = "binary"
headers = {}
