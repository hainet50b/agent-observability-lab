extensions:
  file_storage/queue:
    directory: /var/lib/otelcol/file_storage

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false
  batch: {}

exporters:
  otlp_http:
    endpoint: http://apm-server:8200
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage/queue

service:
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: otelcol-sidecar
    metrics:
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://apm-server:8200
  extensions: [file_storage/queue]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp_http]
