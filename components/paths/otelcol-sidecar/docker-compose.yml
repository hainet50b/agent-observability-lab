# otelcol-sidecar — local OpenTelemetry Collector path component.
#
# A Path component adds a transport-layer hop between the agent and the backend.
# This one inserts a same-host OpenTelemetry Collector:
#
#   Agent ──OTLP(localhost:4318/4317)──▶ Collector ──OTLP──▶ APM Server ──▶ ES
#
# so the agent points at the always-reachable local Collector instead of talking
# to the backend's APM Server directly. This Phase-3a config is a plain relay:
# no durable on-disk queue yet (Phase 3b adds file_storage + sending_queue) and
# no Collector self-telemetry yet (Phase 3c).
#
# Composed into a stack via `include:` alongside a backend component. The
# Collector reaches the backend's APM Server by its Compose service name
# (`apm-server`) because `include:` merges both components into one Compose
# project on a shared default network.
#
# Single-node local demo posture — ports bound to 127.0.0.1, never exposed.

services:
  otel-collector:
    # The contrib distribution (not core) is required: it carries the
    # file_storage extension that backs the durable sending_queue. Pinned
    # explicitly — never :latest.
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: otel-collector
    # Deterministic container hostname so the resourcedetection `system` detector
    # stamps a stable, recognizable host.name (otelcol-sidecar-demo) onto every
    # relayed signal instead of a random container ID. NOTE: this is the
    # CONTAINER's hostname, not the laptop's — see config/otel-collector.yaml and
    # the stack README "host identity" caveat.
    hostname: otelcol-sidecar-demo
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Run as root in this local demo so the Collector can write the file_storage
    # named volume: the contrib image runs as uid 10001, but a fresh named
    # volume is created root-owned, so a non-root Collector cannot create its
    # queue files. Acceptable for a single-node localhost demo (consistent with
    # the backend's security-disabled posture); a real deployment would chown
    # the queue dir to the runtime uid instead.
    user: "0:0"
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Durable sending_queue backing store (file_storage extension). A named
      # volume so queued telemetry survives container restarts, not just the
      # process — the whole point of the on-disk queue.
      - otelcol-queue:/var/lib/otelcol/file_storage
    ports:
      # OTLP gRPC + HTTP, bound to localhost only (demo posture).
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    # No healthcheck: the contrib image is distroless (no shell, no curl/wget) so
    # an in-container probe is impractical. Startup ordering is handled instead by
    # the exporter's retry_on_failure (see config/otel-collector.yaml) — if the
    # APM Server is not up yet the Collector retries rather than depending on it.
    # The stack smoke-test waits for the Collector by polling its OTLP port from
    # the host (which does have curl).
    restart: unless-stopped

volumes:
  # Durable on-disk queue for the otlp_http exporter's sending_queue. Survives
  # container restarts so telemetry buffered during a backend outage is not lost.
  otelcol-queue:
