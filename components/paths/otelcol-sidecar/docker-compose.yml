services:
  otel-collector:
    # contrib (not core): carries the file_storage extension
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: otel-collector
    hostname: otelcol-sidecar-demo
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # root: the named queue volume is root-owned; the image's uid 10001 can't write it
    user: "0:0"
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.id=${AOL_ASSET_ID:-aol-demo-asset-0001}
    volumes:
      - ./config/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otelcol-queue:/var/lib/otelcol/file_storage
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

volumes:
  otelcol-queue:
